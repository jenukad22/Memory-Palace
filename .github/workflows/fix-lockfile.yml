name: Fix Lockfile (Linux)

# Manual only.
#
# STATUS: diagnostic, not yet a confirmed fix. The original theory here was
# that the 27 "extraneous: true" entries under node_modules/vitest/node_modules/
# @esbuild/* were stale Windows node_modules cruft (npm/cli#4828) that a clean
# Linux install would eliminate. A real run of this workflow disproved that: a
# from-zero `rm -rf node_modules package-lock.json && npm install` on
# ubuntu-latest reproduced the exact same 27 entries byte-for-byte, and `npm
# ci` (no flags) succeeded — while EAS's build uses `npm ci --include=dev` and
# fails with EBADPLATFORM. So the lockfile content is not the variable; how
# npm is invoked (and possibly which npm/node version) is. The steps below
# print what's needed to pin that down before this workflow's commit/push
# step is trusted to actually fix anything — see
# src/lockfile-consistency.test.ts for why "no extraneous entries" turned out
# to be the wrong invariant to gate on, kept for now as a candidate check
# pending this investigation, not yet re-enabled in CI.
on:
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm which commit actually got checked out
        run: |
          echo "checked out SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Print the node/npm versions this job's npm commands actually use
        run: |
          echo "node: $(node -v)"
          echo "npm:  $(npm -v)"

      - name: Count extraneous entries in the lockfile AS CHECKED OUT, before any install runs
        run: |
          node -e "
          const lock = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));
          const extraneous = Object.entries(lock.packages).filter(([, v]) => v.extraneous === true);
          console.log('extraneous entries before install:', extraneous.length);
          for (const [name] of extraneous) console.log('  -', name);
          "

      - name: Remove node_modules and the lockfile for a truly clean resolve
        run: rm -rf node_modules package-lock.json

      - name: Fresh npm install on Linux
        run: npm install

      - name: Count extraneous entries in the freshly regenerated lockfile
        run: |
          node -e "
          const lock = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));
          const extraneous = Object.entries(lock.packages).filter(([, v]) => v.extraneous === true);
          console.log('extraneous entries after fresh install:', extraneous.length);
          "

      # Plain npm ci — what this workflow originally verified. Known from a
      # prior run: this succeeds (916 packages).
      - name: Verify plain npm ci succeeds from the newly generated lockfile
        run: |
          rm -rf node_modules
          npm ci

      # EAS Build's actual invocation, reproduced exactly. If this fails here
      # too, the difference is the flag itself (or something it changes about
      # dev-dependency resolution), independent of npm/node version, and
      # reproducible without EAS at all. If it PASSES here, the remaining
      # variable is npm/node version — compare this step's printed versions
      # against the EAS build log's "Install dependencies" banner.
      - name: Reproduce EAS's exact command — npm ci --include=dev
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Check whether the lockfile actually changed
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push the regenerated lockfile
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json on Linux

          Produced by .github/workflows/fix-lockfile.yml (workflow_dispatch): a
          clean rm -rf node_modules package-lock.json && npm install on
          ubuntu-latest, with npm ci verified to succeed from the result
          before this commit."
          git push origin HEAD:main

      - name: Report when nothing changed
        if: steps.diff.outputs.changed == 'false'
        run: echo "Lockfile content is unchanged from a clean Linux install — the fix, if there is one, is not lockfile content. See the diagnostic steps above."
