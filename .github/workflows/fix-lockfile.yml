name: Fix Lockfile (Linux)

# Manual only.
#
# STATUS: diagnostic, not yet a confirmed fix. The original theory here was
# that the 27 "extraneous: true" entries under node_modules/vitest/node_modules/
# @esbuild/* were stale Windows node_modules cruft (npm/cli#4828) that a clean
# Linux install would eliminate. A real run of this workflow disproved that: a
# from-zero `rm -rf node_modules package-lock.json && npm install` on
# ubuntu-latest reproduced the exact same 27 entries byte-for-byte, and `npm
# ci` (no flags) succeeded — while EAS's build uses `npm ci --include=dev` and
# fails with EBADPLATFORM. So the lockfile content is not the variable; how
# npm is invoked (and possibly which npm/node version) is.
#
# This job's own node-version was itself a confound until now: it ran Node 24
# (npm 11.x), while EAS's SDK-57 Android image (docs.expo.dev/build-reference/
# infrastructure, cross-checked against two independent fetches and against
# `eas config`'s own accepted-value validation before eas.json was pinned to
# it) runs Node 22.23.1 / npm 10.9.8 — a full major-version npm gap. Pinned
# below to match exactly, and eas.json's preview.android.image is now pinned
# to "ubuntu-26.04-jdk-17-ndk-r27b-sdk-57" so this comparison stays valid
# instead of drifting with whatever `auto` resolves to that week. If
# `npm ci --include=dev` still passes here at the matched version, the flag
# is the trigger, independent of npm version, and the image pin doesn't fix
# EAS's build — that would need chasing further. If it fails here too, the
# npm-version theory is confirmed and the pin should be enough.
#
# See src/lockfile-consistency.test.ts for why "no extraneous entries" turned
# out to be the wrong invariant to gate CI on — kept as a candidate pending
# this investigation, not yet re-enabled.
#
# AUTO-COMMIT DISABLED BY DEFAULT. `npm install` (used deliberately here, to
# force a full re-resolve) reruns dependency resolution against whatever is
# currently published to the registry, not just what's already locked. Most
# of this tree pins exact versions, but a few ranges are wide enough to cross
# real boundaries between two dispatches run at different times — e.g.
# react-native-reanimated depends on react-native-worklets via "0.10.x -
# 0.11.x", which resolved to 0.10.3 on one run and 0.11.3 on a later one, and
# landed on main un-reviewed (the exact failure this workflow's own commit
# step caused: see the 2026-08-05 incident where a "fix-lockfile" dispatch
# silently introduced a worklets version EAS's own npm ci then rejected as
# lockfile-inconsistent). Every dispatch is therefore a genuinely new,
# uncontrolled resolution — the workflow is not the bug, but landing its
# output unattended is. Set `apply_and_push: true` to opt back into the old
# behavior once a run's diagnostics have actually been read.
on:
  workflow_dispatch:
    inputs:
      apply_and_push:
        description: 'Commit and push the regenerated lockfile if it changed (leave off to just see the diagnostics)'
        required: true
        default: false
        type: boolean

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Confirm which commit actually got checked out
        run: |
          echo "checked out SHA: $(git rev-parse HEAD)"
          git log -1 --oneline

      # Pinned to match EAS's SDK-57 Android image exactly (see header) —
      # was 24 (npm 11.x); this comparison is meaningless unless the npm
      # version matches what EAS actually runs.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Print the node/npm versions this job's npm commands actually use
        run: |
          echo "node: $(node -v)  (EAS SDK-57 image runs 22.23.1)"
          echo "npm:  $(npm -v)  (EAS SDK-57 image runs 10.9.8)"

      - name: Count extraneous entries in the lockfile AS CHECKED OUT, before any install runs
        run: |
          node -e "
          const lock = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));
          const extraneous = Object.entries(lock.packages).filter(([, v]) => v.extraneous === true);
          console.log('extraneous entries before install:', extraneous.length);
          for (const [name] of extraneous) console.log('  -', name);
          "

      - name: Remove node_modules and the lockfile for a truly clean resolve
        run: rm -rf node_modules package-lock.json

      - name: Fresh npm install on Linux
        run: npm install

      - name: Count extraneous entries in the freshly regenerated lockfile
        run: |
          node -e "
          const lock = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8'));
          const extraneous = Object.entries(lock.packages).filter(([, v]) => v.extraneous === true);
          console.log('extraneous entries after fresh install:', extraneous.length);
          "

      # Plain npm ci — what this workflow originally verified. Known from a
      # prior run: this succeeds (916 packages).
      - name: Verify plain npm ci succeeds from the newly generated lockfile
        run: |
          rm -rf node_modules
          npm ci

      # EAS Build's actual invocation, reproduced exactly. If this fails here
      # too, the difference is the flag itself (or something it changes about
      # dev-dependency resolution), independent of npm/node version, and
      # reproducible without EAS at all. If it PASSES here, the remaining
      # variable is npm/node version — compare this step's printed versions
      # against the EAS build log's "Install dependencies" banner.
      - name: Reproduce EAS's exact command — npm ci --include=dev
        run: |
          rm -rf node_modules
          npm ci --include=dev

      - name: Check whether the lockfile actually changed
        id: diff
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show what changed, if anything (always visible, even in dry-run)
        if: steps.diff.outputs.changed == 'true'
        run: git diff -- package-lock.json

      - name: Commit and push the regenerated lockfile
        if: steps.diff.outputs.changed == 'true' && inputs.apply_and_push == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: regenerate package-lock.json on Linux

          Produced by .github/workflows/fix-lockfile.yml (workflow_dispatch,
          apply_and_push=true): a clean rm -rf node_modules package-lock.json
          && npm install on ubuntu-latest, with npm ci verified to succeed
          from the result before this commit."
          git push origin HEAD:main

      - name: Changed, but not applying (dry run)
        if: steps.diff.outputs.changed == 'true' && inputs.apply_and_push == false
        run: echo "Lockfile changed (diff above) but apply_and_push was left off, so nothing was committed. Read the diagnostics and the diff, then re-dispatch with apply_and_push=true if this is actually wanted."

      - name: Report when nothing changed
        if: steps.diff.outputs.changed == 'false'
        run: echo "Lockfile content is unchanged from a clean Linux install."
